services:
  api:
    build: ./api
    container_name: api-demo
    ports:
      - "8080:8080"
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.3
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-demo.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  # Generador de carga: docker compose --profile carga run --rm k6
  k6:
    image: grafana/k6:1.2.0
    profiles: ["carga"]
    command: run /scripts/carga.js
    environment:
      BASE_URL: http://api:8080
      DURACION: ${DURACION:-4m}
    volumes:
      - ./carga:/scripts
      - ./resultados:/resultados
    depends_on:
      - api
