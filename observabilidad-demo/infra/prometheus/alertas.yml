groups:
  - name: api-demo-slo
    rules:
      # Alertar por síntomas que ve el usuario (latencia y errores), no por CPU
      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95,
            sum by (le, uri) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[2m]))
          ) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 de {{ $labels.uri }} por encima de 500 ms"

      - alert: TasaErroresAlta
        expr: |
          sum by (uri) (rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[2m]))
            /
          sum by (uri) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[2m])) > 0.02
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Más del 2% de errores 5xx en {{ $labels.uri }}"
