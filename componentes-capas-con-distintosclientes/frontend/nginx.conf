# =============================================================
# MICOS HAKARI — Configuración Nginx para el frontend
# Sirve la SPA de React y hace proxy de /api al backend.
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta no encontrada cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API REST hacia el backend (contenedor "backend")
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de assets estáticos (hasheados por Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache de posters
    location /posters/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}