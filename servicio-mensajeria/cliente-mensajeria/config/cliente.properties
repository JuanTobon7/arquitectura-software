# Configuración del cliente de mensajería.
# Las rutas relativas se resuelven desde la carpeta donde se ejecuta el cliente.

# Servidor al que se conecta por TCP (se puede cambiar en la ventana de inicio de sesión)
servidor.host=localhost
servidor.puerto=5000

# Historial local de conversaciones (H2 embebido; no hay que instalar nada).
# AUTO_SERVER=TRUE permite abrir varios clientes en el mismo equipo con la misma base, y
# DB_CLOSE_DELAY=-1 la deja abierta mientras el cliente corre (sin eso los clientes se
# estorban abriéndola y cerrándola en cada operación).
bd.url=jdbc:h2:./datos/historial;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
bd.usuario=sa
bd.contrasena=

# Carpeta donde se guardan los archivos e imágenes enviados y recibidos
descargas.directorio=datos/descargas

# Filtros que el usuario puede elegir al enviar una imagen. Deben coincidir con
# filtros.activos del servidor; si no se elige ninguno, el servidor aplica todos.
filtros.disponibles=escala_grises,sepia,girar_180,brillo,reduccion

# Tamaño máximo de un archivo. Debe coincidir con mensajes.tamanoMaximoBytes del servidor:
# si se envía uno más grande, el servidor cierra la conexión.
archivos.tamanoMaximoBytes=10485760
